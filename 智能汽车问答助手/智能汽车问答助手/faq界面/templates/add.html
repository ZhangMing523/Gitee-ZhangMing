<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>添加新知识</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">知识管理</h1>
            <nav>
                <a href="/" class="nav-button">
                    <i class="fas fa-arrow-left"></i> 返回首页
                </a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="form-card">
                {% if error %}
                <div class="alert alert-error">
                    <i class="fas fa-exclamation-circle"></i> {{ error }}
                </div>
                {% endif %}
                <form method="POST" id="addForm">
                    <div class="form-group">
                        <label for="question"><i class="fas fa-question-circle"></i> 常见问题</label>
                        <input type="text"
                               id="question"
                               name="question"
                               required
                               placeholder="例如：如何查看汽车订单状态？">
                    </div>
                    <div class="form-group">
                        <label for="answer"><i class="fas fa-comment-dots"></i> 标准答案</label>
                        <textarea id="answer"
                                  name="answer"
                                  rows="5"
                                  required
                                  placeholder="请输入详细的解答步骤..."></textarea>
                    </div>
                    <button type="submit" class="submit-button">
                        <i class="fas fa-save"></i> 保存知识
                    </button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
